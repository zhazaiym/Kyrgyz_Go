services:
  api:
    image: kyrgyzgo-api:local
    build: .
    env_file:
      - .env
    environment:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.240.2}
    networks:
      default: {}
      proxy:
        ipv4_address: ${API_PROXY_IP:-172.30.240.3}
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPU_LIMIT:-2.0}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  https:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-13.53.40.37}
    networks:
      proxy:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.240.2}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

networks:
  default: {}
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.240.0/28}

volumes:
  caddy_data:
  caddy_config:
