[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backups", "docs", ".ml-test-tmp"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "ARG"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Cookie", "fastapi.Depends", "fastapi.File", "fastapi.Form",
    "fastapi.Header", "fastapi.Path", "fastapi.Query", "fastapi.Security",
    "fastapi_filter.FilterDepends", "mysite.api.admin.require_admin_roles",
]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are requested by name for their side effects.
"tests/**" = ["ARG"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.isort]
line_length = 100
multi_line_output = 0
include_trailing_comma = false
use_parentheses = true
known_first_party = ["ML", "mysite", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
