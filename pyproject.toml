[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backups", "docs", "migrations", ".ml-test-tmp", ".chat-deploy", ".test-tmp-email-auth", "chat-check-dm4sqobk"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.isort]
line_length = 100
multi_line_output = 0
include_trailing_comma = false
use_parentheses = true
known_first_party = ["ML", "mysite", "scripts", "tests"]
