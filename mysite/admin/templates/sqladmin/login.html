{% extends "sqladmin/base.html" %}
{% block body %}
<div class="d-flex align-items-center justify-content-center vh-100">
  <form class="col-lg-6 col-md-6 card card-md" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">Вход в админку Kerben Travel</h2>
      {% for field, label, kind in [('username', 'Логин', 'text'), ('password', 'Пароль', 'password')] %}
      <div class="mb-3">
        <label class="form-label" for="{{ field }}">{{ label }}</label>
        <input id="{{ field }}" name="{{ field }}" type="{{ kind }}" class="form-control{% if error %} is-invalid{% endif %}" autocomplete="off" required>
        {% if error and loop.first %}<div class="invalid-feedback">{{ error }}</div>{% endif %}
      </div>
      {% endfor %}
      <label class="form-check"><input type="checkbox" name="remember_device" class="form-check-input"> Доверять этому браузеру 30 дней</label>
      <div class="form-footer"><button type="submit" class="btn btn-primary w-100">Войти</button></div>
    </div>
  </form>
</div>
{% endblock %}
