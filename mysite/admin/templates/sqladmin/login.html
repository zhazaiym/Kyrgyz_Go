{% extends "sqladmin/base.html" %}
{% block body %}
<div class="kt-login">
  <form class="card card-md" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
    <div class="card-body">
      <div class="kt-brand">
        <span class="kt-brand-mark"><i class="fa-solid fa-mountain-sun"></i></span>
        <span class="kt-brand-text">
          <span class="kt-brand-name">Kerben Travel</span>
          <span class="kt-brand-sub">Вход в панель управления</span>
        </span>
      </div>
      {% for field, label, kind in [('username', 'Логин', 'text'), ('password', 'Пароль', 'password')] %}
      <div class="mb-3">
        <label class="form-label" for="{{ field }}">{{ label }}</label>
        <input id="{{ field }}" name="{{ field }}" type="{{ kind }}" class="form-control{% if error %} is-invalid{% endif %}" autocomplete="off" required>
        {% if error and loop.first %}<div class="invalid-feedback">{{ error }}</div>{% endif %}
      </div>
      {% endfor %}
      <div class="form-footer"><button type="submit" class="btn btn-primary w-100">Войти</button></div>
    </div>
  </form>
</div>
{% endblock %}
