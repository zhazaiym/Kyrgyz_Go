
name: Check SSH Key

on:
  push:
    branches:
      - jazi
    paths:
      - '.github/workflows/check-ssh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ssh:
    runs-on: ubuntu-24.04

    steps:
      - name: Check SSH key fingerprint
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key | ssh-keygen -lf - -E sha256
          rm -f ~/.ssh/deploy_key
