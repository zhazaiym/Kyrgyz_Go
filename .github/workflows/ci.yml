
name: KyrgyzGo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check Python
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q main.py ML mysite scripts alembic

      - name: Lint Python
        run: |
          ruff check --output-format=github .
          python -m scripts.format_code --check

      - name: Audit dependency vulnerabilities
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Scan runtime security issues
        run: python -m bandit -r ML mysite main.py -ll

      - name: Run isolated ML tests without database or Gemini calls
        run: python -m pytest --confcutdir=tests/ml tests/ml -q

      - name: Run test harness unit tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/postgres
          SECRET_KEY: test-secret-key-for-isolated-tests
        run: python -m pytest --confcutdir=tests/unit tests/unit -q

      - name: Run test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-m", "scripts.run_tests", "-q"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          print(result.stdout, end="")
          if result.returncode:
              detail = " | ".join(result.stdout.strip().splitlines()[-8:])
              detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=pytest diagnostics::{detail[:3500]}")
          sys.exit(result.returncode)
          PY

  deploy:
    name: Deploy tested backend
    needs: test
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Download the tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reject a superseded revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo 'Deployment refused: tested revision is no longer main.'
            exit 1
          fi

      - name: Upload source through the guarded server helper
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_TARGET" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          key_file="$RUNNER_TEMP/kyrgyzgo-deploy-key"
          hosts_file="$RUNNER_TEMP/kyrgyzgo-deploy-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          python -m scripts.manual_deploy --skip-tests \
            --host "$DEPLOY_TARGET" --known-hosts "$hosts_file" \
            --key "$key_file" --revision "$GITHUB_SHA"
